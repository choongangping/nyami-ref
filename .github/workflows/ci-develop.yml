name: CI for Develop PR  # Github actions로 CI 과정을 자동화하기 위한 파일

# 조직의 develop 브랜치로 pr을 보내면 실행됩니다.
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

# Ubuntu 최신 버전으로 Github actions 환경을 설정합니다.
jobs:
  build_and_test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # pr에 포함된 코드를 Github actions 서버에 다운로드합니다.
      - name: Checkout Repository
        uses: actions/checkout@v3

      # application.yml의 환경 변수를 설정합니다.
      - name: Set environment variables
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> $GITHUB_ENV
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> $GITHUB_ENV
          echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
          echo "DB_PASS=${{ secrets.DB_PASS }}" >> $GITHUB_ENV
          echo "LOG_PATH=${{ secrets.LOG_PATH }}" >> $GITHUB_ENV

      # jdk 버전을 17로 설정합니다.
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      # Github actions 실행 시에 gradle 캐시를 저장해 빌드 속도를 최적화합니다.
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Github actions에 gradlew 파일의 실행 권한을 부여합니다.
      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      # gradle 빌드를 실행합니다.
      - name: Build Project
        run: ./gradlew build --no-daemon

      # gradle 단위 테스트를 실행합니다.
      - name: Run Tests
        run: ./gradlew test --no-daemon -Dspring.config.location=classpath:/application-test.yml

      # gradle 코드 스타일을 검사합니다.
      - name: Lint Check
        run: ./gradlew check --no-daemon

  # CI 실패 알림을 Slack에 전송합니다.
  notify_failure:
    if: always() && failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification on CI Failure
        run: |
          LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST -H "Content-Type: application/json" --data @- ${{ secrets.SLACK_WEBHOOK_URL }} <<EOF
          {
            "mrkdwn": true,
            "text": "🚨 *CI 프로세스가 실패했습니다.*\n\n🔍 로그를 확인하세요.\n🔗 <${LOG_URL}|GitHub Actions 로그>"
          }
          EOF

  # pr 병합 알림을 Slack에 전송합니다.
  notify_merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Get Last Merged PR Info
        id: last_pr
        run: |
          PR_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=closed&sort=updated&direction=desc" \
            | jq '[.[] | select(.merged_at != null)] | first')
          
          PR_NUMBER=$(echo "$PR_JSON" | jq '.number')
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_URL=$(echo "$PR_JSON" | jq -r '.html_url')

          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_ENV
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

      - name: Send Slack Notification on Merge
        run: |
          curl -X POST -H "Content-Type: application/json" --data @- ${{ secrets.SLACK_WEBHOOK_URL }} <<EOF
          {
            "mrkdwn": true,
            "text": "🔄 PR이 성공적으로 병합되었습니다.\n\n📄 *#${{ env.PR_NUMBER }} - ${{ env.PR_TITLE }}*\n🔗 <${{ env.PR_URL }}|PR 링크>"
          }
          EOF